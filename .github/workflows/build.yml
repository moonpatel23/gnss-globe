name: Build GNSS Globe APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip if present
        run: |
          if [ -f gnss-globe-project.zip ]; then
            unzip -o -q gnss-globe-project.zip
          fi
          test -f settings.gradle.kts || { echo "Project files not found"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Download and bundle Cesium
        run: |
          mkdir -p /tmp/cesium && cd /tmp/cesium
          npm pack cesium --silent
          tar xzf cesium-*.tgz
          rm -rf "$GITHUB_WORKSPACE/app/src/main/assets/cesium"
          cp -r package/Build/Cesium "$GITHUB_WORKSPACE/app/src/main/assets/cesium"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: gnss-globe-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
